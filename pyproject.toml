[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".local",
  "node_modules",
  "dist",
  "test-results",
  "playwright-report",
  "vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests configure temporary databases and import paths before loading the app.
"deploy/context/bridge/test_*.py" = ["E402"]
# These protocol validators distinguish JSON booleans from integers exactly.
"deploy/context/bridge/memory_archive.py" = ["E721"]
"infrastructure/network/helper.py" = ["E721"]
"infrastructure/storage/helper.py" = ["E721"]
"infrastructure/storage/worker-assets/inventory.py" = ["E721"]
