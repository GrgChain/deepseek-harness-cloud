  /oidc/authorize:
    get:
      operationId: oidcAuthorization
      x-api-id: API-064
      tags:
      - Identity
      description: Only the configured client and exact HC_PUBLIC_URL/auth/callback are accepted. Duplicate or unsupported
        parameters are rejected.
      security: []
      responses:
        '303':
          description: HTML navigation with an expired or unbound BFF transaction restarts at /auth/login.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
        '200':
          description: Same-origin login form with a five-minute browser/CSRF challenge.
          content:
            text/html:
              schema:
                type: string
          headers:
            Set-Cookie:
              description: Secure/HttpOnly/SameSite=Lax __Host-hc_identity; Path=/; Max-Age=300.
              schema:
                type: string
        '400':
          description: Invalid protocol request or grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProtocolError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProtocolError'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProtocolError'
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
      - name: response_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - code
      - name: scope
        in: query
        required: true
        schema:
          type: string
          description: Space-separated unique openid/profile/email; openid required.
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
      - name: nonce
        in: query
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
          enum:
          - S256
      - name: prompt
        in: query
        required: false
        schema:
          type: string
          enum:
          - login
      - name: response_mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - query
  /oidc/login:
    post:
      operationId: oidcPasswordLogin
      x-api-id: API-065
      tags:
      - Identity
      description: A bounded urlencoded form authenticates the account and consumes its browser-bound authorization challenge.
        No password or protocol tokens are returned in the form.
      security:
      - OIDCLoginChallenge: []
      responses:
        '303':
          description: Redirect to the exact callback with code and original state, or restart HTML login at /auth/login
            when its browser challenge or BFF transaction is no longer valid. A restart never resubmits the password.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
        '401':
          description: Uniform wrong-password/unknown/disabled-account feedback; expired or consumed challenges require a
            new login.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid protocol request or grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProtocolError'
        '403':
          description: Origin or CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProtocolError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProtocolError'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProtocolError'
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: Must equal HC_PUBLIC_URL.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - request
              - csrf
              - login
              - password
              properties:
                request:
                  type: string
                  format: uuid
                csrf:
                  type: string
                  minLength: 43
                  maxLength: 43
                login:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 72
                  writeOnly: true
