openapi: 3.0.3
info:
  title: DSH Cloud Platform API
  version: 0.1.0
  description: V0.1 development contract; identity, configuration, owner resource queries, controlled access, lifecycle commands
    and reconciled failed-operation retry implemented; create/start require runtime observations and complete template approval.
    Local real OIDC/defaults/one-click creation/Gateway entry passed; full model task and operational acceptance remain pending.
    Single-organization Docker platform. OIDC/BFF cookies, CSRF, versioned configuration, durable operations and server-held
    native DSH sessions.
x-design-baseline: DSHC Initial Release V0.1
x-requirements-version: DSHC Initial Release V0.1
x-requirements-coverage: REQ-01 through REQ-23; identity supply and complete governance acceptance remain pending; runtime
  compatibility requires pinned-image contract and real browser tests.
x-contract-status: partially-implemented
security:
- portalSession: []
tags:
- name: Identity
- name: Templates
- name: Instances
- name: Operations
- name: Access
- name: Storage
- name: Skills
- name: Context
- name: Connectors
- name: OperationLogs
- name: Configuration
- name: Preflight
- name: IdentityManagement
paths:
  /v1/connectors:
    get:
      operationId: listOwnMCPConnectors
      x-api-id: API-100
      tags:
      - Connectors
      summary: List personal MCP connectors and approved endpoint options
      description: Requires current connectors:read. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnectorList'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createOwnMCPConnector
      x-api-id: API-101
      tags:
      - Connectors
      summary: Create a connector without invoking tools
      description: Requires current connectors:manage. Owner and organization are server selected. No DSH changes.
      responses:
        '201':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnector'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPConnectorInput'
  /v1/connectors/{id}:
    parameters:
    - &mcp_path_id
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateOwnMCPConnector
      x-api-id: API-102
      tags:
      - Connectors
      summary: Update or disable a connector; invalidate verification and tool grants
      description: Requires current connectors:manage. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnector'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPConnectorInput'
    delete:
      operationId: deleteOwnMCPConnector
      x-api-id: API-103
      tags:
      - Connectors
      summary: Delete credentials and grants, preserve metadata-only calls
      description: Requires current connectors:manage. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  deleted:
                    type: boolean
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_version
              - confirmed_name
              additionalProperties: false
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                confirmed_name:
                  type: string
  /v1/connectors/{id}/oauth:
    parameters:
    - *mcp_path_id
    post:
      operationId: startOwnMCPConnectorOAuth
      x-api-id: API-115
      tags: [Connectors]
      summary: Start owner-scoped OAuth authorization with PKCE
      description: Requires connectors:manage, CSRF and current version. Returns the official authorization URL; never returns tokens or client secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 1}
      responses:
        '200':
          description: Navigate the current browser to the authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url: {type: string, format: uri}
        default:
          description: Denied, unavailable, incompatible or stale configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/connectors/oauth/callback:
    get:
      operationId: finishOwnMCPConnectorOAuth
      x-api-id: API-116
      tags: [Connectors]
      summary: Consume a single-use OAuth state and verify the connection
      description: Bound to the initiating owner, organization, portal session, connector version and exact target. Exchanges the code with PKCE, encrypts tokens and verifies tools without enabling or invoking them. State expires after 10 minutes. Browser login expiry returns to the workbench; no tokens or provider error details appear in redirects.
      parameters:
      - {name: state, in: query, required: true, schema: {type: string, minLength: 43, maxLength: 43}}
      - {name: code, in: query, schema: {type: string, maxLength: 8192}}
      - {name: error, in: query, schema: {type: string, maxLength: 8192}}
      - {name: error_description, in: query, schema: {type: string, maxLength: 8192}}
      - {name: error_uri, in: query, schema: {type: string, maxLength: 8192}}
      - {name: iss, in: query, schema: {type: string, maxLength: 8192}}
      responses:
        '303':
          description: Return to /app/connectors with a non-sensitive outcome
          headers:
            Location: {schema: {type: string}}
        default:
          description: Authentication, permission or request limit failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/connectors/{id}/sync:
    parameters:
    - *mcp_path_id
    post:
      operationId: syncOwnMCPTools
      x-api-id: API-104
      tags:
      - Connectors
      summary: Validate protocol and publish a complete tool catalog
      description: Requires current connectors:manage. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnector'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_version
              additionalProperties: false
              properties:
                expected_version:
                  type: integer
                  minimum: 1
  /v1/connectors/{id}/tools:
    parameters:
    - *mcp_path_id
    post:
      operationId: selectOwnMCPTools
      x-api-id: API-105
      tags:
      - Connectors
      summary: Select tools from the current definition snapshot
      description: Requires current connectors:manage. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnector'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_version
              - enabled_tools
              additionalProperties: false
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                enabled_tools:
                  type: array
                  items:
                    type: string
                  maxItems: 1000
  /v1/connectors/{id}/invoke:
    parameters:
    - *mcp_path_id
    post:
      operationId: invokeOwnMCPTool
      x-api-id: API-106
      tags:
      - Connectors
      summary: Confirm and invoke once; never retry on uncertain results
      description: Requires current connectors:invoke. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCall'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPInvokeInput'
  /v1/connectors/{id}/calls:
    parameters:
    - *mcp_path_id
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        enum:
        - 10
        - 20
        - 50
        default: 10
    get:
      operationId: listOwnMCPCalls
      x-api-id: API-107
      tags:
      - Connectors
      summary: Page metadata-only call records
      description: Requires current connectors:read. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MCPCall'
                  total:
                    type: integer
                    minimum: 0
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/connectors/calls/{id}:
    parameters:
    - *mcp_path_id
    get:
      operationId: getOwnMCPCall
      x-api-id: API-108
      tags:
      - Connectors
      summary: Read call state without stored arguments or results
      description: Requires current connectors:read. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCall'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/connectors/calls/{id}/cancel:
    parameters:
    - *mcp_path_id
    post:
      operationId: cancelOwnMCPCall
      x-api-id: API-109
      tags:
      - Connectors
      summary: Request cancellation; external effects may already have occurred
      description: Requires current connectors:invoke. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  cancel_requested:
                    type: boolean
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
  /v1/connectors/export:
    post:
      operationId: exportOwnMCPConfig
      x-api-id: API-110
      tags:
      - Connectors
      summary: Export configuration without credentials or enabled grants
      description: Requires current connectors:manage. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConfigPackage'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
  /v1/connectors/import:
    post:
      operationId: importOwnMCPConfig
      x-api-id: API-111
      tags:
      - Connectors
      summary: Preview or atomically import remote configuration; ignore imported headers, reject commands
      description: Requires current connectors:manage. Owner and organization are server selected. No DSH changes.
      responses:
        '200':
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPImportPreview'
        default:
          description: Denied, invalid, unavailable or conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - package
              - confirmed
              additionalProperties: false
              properties:
                package:
                  type: object
                  additionalProperties: true
                  description: hc-mcp-v1 or mcpServers remote entries; never executes commands.
                confirmed:
                  type: boolean
  /v1/context/{kind}:
    parameters:
    - $ref: '#/components/parameters/ContextKind'
    get:
      operationId: listOwnExternalContext
      x-api-id: API-095
      tags: [Context]
      summary: List own external connections, approved endpoint labels and instance bindings
      description: Requires current memory:read or knowledge:read. Owner and organization are server selected. URLs, MAC keys and encrypted credentials are never returned. Workbench features do not load into DSH. Integration is a reserved compatibility field.
      responses:
        '200':
          description: Connections and approved endpoint labels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createOwnExternalContext
      x-api-id: API-096
      tags: [Context]
      summary: Create an explicitly approved external connection
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextInput' }
      responses:
        '200':
          description: Credential encrypted; connection awaits verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextConnection' }
        default: { $ref: '#/components/responses/Error' }
  /v1/context/{kind}/{id}:
    parameters:
    - $ref: '#/components/parameters/ContextKind'
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    put:
      operationId: updateOwnExternalContext
      x-api-id: API-097
      tags: [Context]
      summary: Update own connection with optimistic version check and reset verification
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextInput' }
      responses:
        '200':
          description: Updated connection; pending external operations prevent configuration changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextConnection' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeOwnExternalContext
      x-api-id: API-098
      tags: [Context]
      summary: Remove connection metadata and bindings; retain external data
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextInput' }
      responses:
        '200': { description: Removed after exact confirmed_name and expected_version checks }
        default: { $ref: '#/components/responses/Error' }
  /v1/context/{kind}/{id}/{action}:
    parameters:
    - $ref: '#/components/parameters/ContextKind'
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: action
      in: path
      required: true
      schema:
        type: string
        enum: [verify, list, search, get, export, preview, apply, delete, rebuild, binding, reconcile]
    post:
      operationId: operateOwnExternalContext
      x-api-id: API-099
      tags: [Context]
      summary: Authorized external content operation, instance binding or original-operation reconciliation
      description: >-
        Every POST requires Origin, CSRF and current permissions. list/search/get/export require kind:read;
        other actions require kind:manage and read. Binding additionally requires instances:configure and instances:read.
        Scope defaults to personal; workspace UUID requires current ownership and instances:read.
        Apply requires an unexpired preview, confirmed=true and idempotency_key; delete/rebuild also require record_version.
        Unknown deletion suppresses recall until reconciliation of the original encrypted request. Unknown indexing may serve the previous usable revision marked STALE.
        Reconcile body is an empty object. Binding body uses instance_id, enabled, expected_version, expected_binding_version.
        Native namespaces, URLs, tenant filters and arbitrary remote operation IDs cannot be submitted.
        External response capabilities determine supported operations and formats; no fallback backend is selected.
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ContextAction'
              - $ref: '#/components/schemas/ContextBindingInput'
              - type: object
                maxProperties: 0
                additionalProperties: false
      responses:
        '200':
          description: Action result; export is a downloadable hc-memory-v1 JSON package, search includes authorized source snippets and record versions
          content:
            application/json:
              schema: { type: object }
        default: { $ref: '#/components/responses/Error' }
  /v1/storage-assets/{id}:release:
    post:
      operationId: releaseOwnStorage
      x-api-id: API-080
      tags: [Storage]
      summary: Permanently release own deleted workspace storage
      description: >-
        Requires current instances:release-storage permission, exact Owner/organization,
        Portal Origin and CSRF. Confirm the exact asset ID and workspace name. The Owner
        may end retention early for an already deleted workspace; legal hold, active or
        uncertain work, conflicting maintenance and unconfirmed bindings still block release.
        A durable per-asset request and audit precede physical IO. Repeating the request
        returns the same request. Accepted is not physical completion; quota remains until
        Worker confirms original disk absence and atomically publishes the final audit.
        Existing backup archives remain independent. No query parameters accepted.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed_name, confirmed_asset_id]
              properties:
                confirmed_name: {type: string, minLength: 1, maxLength: 32}
                confirmed_asset_id: {type: string, format: uuid}
      responses:
        '202':
          description: Original durable release request; no-store. Poll the asset status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, asset_id, status]
                properties:
                  request_id: {type: string, format: uuid}
                  asset_id: {type: string, format: uuid}
                  status: {type: string, enum: [ACCEPTED, RUNNING, UNCERTAIN, SUCCEEDED]}
        default:
          $ref: '#/components/responses/Error'
  /v1/storage-assets:
    get:
      operationId: listStorageAssets
      x-api-id: API-077
      tags:
      - Storage
      summary: List own active and retained data assets
      description: Requires a current instances:read permission and exact owner/organization.
        Administrators have no implicit access to other owners. Read-only metadata;
        no filesystem paths, keys, backup contents or file names. Missing or foreign
        assets return 404. No resource collection or maintenance is triggered by GET.
        Unknown or repeated query parameters are rejected.
      parameters:
      - &storage_path_id002
        name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000000000
          default: 1
      - &storage_path_id003
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        description: PROCESSING groups PREPARING, RESTORING and RECLAIM_PENDING before
          pagination and counting. Responses retain the underlying asset status.
        schema:
          type: string
          enum:
          - PROCESSING
          - PREPARING
          - READY
          - RETAINED
          - RESTORING
          - RECLAIM_PENDING
          - DELETED
      - name: q
        in: query
        description: Literal workspace-name prefix, Chinese letters/digits/_/-; up to
          32 characters.
        schema:
          type: string
          maxLength: 32
      responses:
        '200':
          description: Safe owner metadata; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageAssetPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/storage-assets/{id}:
    get:
      operationId: getStorageAsset
      x-api-id: API-078
      tags:
      - Storage
      summary: Read own data asset usage, retention, backup and maintenance conditions
      description: Requires a current instances:read permission and exact owner/organization.
        Administrators have no implicit access to other owners. Read-only metadata;
        no filesystem paths, keys, backup contents or file names. Missing or foreign
        assets return 404. No resource collection or maintenance is triggered by GET.
        Unknown or repeated query parameters are rejected.
      parameters:
      - &storage_path_id001
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Safe owner metadata; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageAsset'
        default:
          $ref: '#/components/responses/Error'
  /v1/storage-assets/{id}/backups:
    get:
      operationId: listStorageBackups
      x-api-id: API-079
      tags:
      - Storage
      summary: List safe backup history for an owned asset
      description: Requires a current instances:read permission and exact owner/organization.
        Administrators have no implicit access to other owners. Read-only metadata;
        no filesystem paths, keys, backup contents or file names. Missing or foreign
        assets return 404. No resource collection or maintenance is triggered by GET.
        Unknown or repeated query parameters are rejected.
      parameters:
      - *storage_path_id001
      - *storage_path_id002
      - *storage_path_id003
      responses:
        '200':
          description: Safe owner metadata; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBackupPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/storage-assets/{id}/files:
    get:
      operationId: listOwnStorageFiles
      x-api-id: API-081
      tags: [Storage]
      summary: Browse a fixed directory in an owned stopped workspace disk
      description: >-
        Requires current instances:read and exact Owner/organization. Only root=workspace
        (/data/workspace) or root=dsh (/data/dsh) is accepted. The workspace must be
        stopped or soft-deleted. Lists are read-only, paged at 100 entries, and disclose
        only direct-child names, types, sizes and modification times. Relative paths reject
        traversal and symlinks are never followed. No uploads, edits or deletes.
      parameters:
      - *storage_path_id001
      - name: root
        in: query
        required: true
        schema: {type: string, enum: [workspace, dsh]}
      - name: path
        in: query
        description: Optional relative directory path below the selected fixed root.
        schema: {type: string, maxLength: 4096, default: ''}
      - name: after
        in: query
        description: Last item name from the prior page.
        schema: {type: string, maxLength: 255}
      responses:
        '200':
          description: One direct directory page; no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageDirectory'
        default:
          $ref: '#/components/responses/Error'
  /v1/storage-assets/{id}/file:
    get:
      operationId: readOwnStorageFile
      x-api-id: API-082
      tags: [Storage]
      summary: Preview or download one regular file from a fixed data directory
      description: >-
        Requires current instances:read, exact Owner/organization, and a stopped or
        soft-deleted workspace. mode=PREVIEW returns UTF-8 plain text up to 512 KiB;
        mode=DOWNLOAD returns an attachment up to 64 MiB. Absolute paths, traversal,
        symlinks, special files and other roots are rejected. Content is no-store and
        never persisted as an audit record.
      parameters:
      - *storage_path_id001
      - name: root
        in: query
        required: true
        schema: {type: string, enum: [workspace, dsh]}
      - name: path
        in: query
        required: true
        schema: {type: string, minLength: 1, maxLength: 4096}
      - name: mode
        in: query
        required: true
        schema: {type: string, enum: [PREVIEW, DOWNLOAD]}
      responses:
        '200':
          description: Text preview or binary attachment; no-store and nosniff.
          content:
            text/plain:
              schema: {type: string}
            application/octet-stream:
              schema: {type: string, format: binary}
        default:
          $ref: '#/components/responses/Error'
