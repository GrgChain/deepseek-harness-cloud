              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                          maxLength: 128
                        name:
                          type: string
        default: *id001
      parameters:
      - *id004
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_version
              properties:
                expected_version: *id005
                api_key:
                  type: string
                  maxLength: 4096
                  writeOnly: true
                  format: password
