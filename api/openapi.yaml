    CreateInstance:
      type: object
      additionalProperties: false
      description: An empty object uses personal default, then organization default. Explicit model must be an owned connection
        or the organization model. Invalid selection/default blocks acceptance; no silent fallback. Template overrides
        still equal approved defaults. spec_id selects an enabled approved CPU/memory/storage tuple; absent uses the organization default. Binding is frozen once per idempotency receipt. Portal selects a provider account and resolves its default model; DSH may switch among eligible models in that account. An optional name is part of the same idempotency digest.
      properties:
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        name:
          type: string
          pattern: '^[\p{L}\p{N}_-]{1,32}$'
        backend_type:
          $ref: '#/components/schemas/BackendType'
        template_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        template_version:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        spec_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        model_configuration_id:
