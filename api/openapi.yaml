          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        autostart:
          type: boolean
          default: true
          enum:
          - true
          description: One-click creation always starts the instance.
        model_configuration_version:
          type: integer
          format: int64
          minimum: 1
