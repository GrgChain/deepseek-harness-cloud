    get:
      operationId: listProviderAccounts
      x-api-id: API-072
      tags:
      - PersonalModels
      summary: 读取本人模型提供商账号
      description: Requires personal-model:read. Returns up to 20 live provider accounts and their selected models; model
        usage counts determine whether removal is allowed.
      responses:
        '200':
          description: Successful owner-scoped result; keys are never returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/ProviderAccount'
        default: &id001
          $ref: '#/components/responses/Error'
    post:
      operationId: createProviderAccount
      x-api-id: API-073
      tags:
      - PersonalModels
      summary: 原子添加账号和多个模型
      description: Requires personal-model:write, exact Origin, CSRF and a stable Idempotency-Key. Expected version must be
        zero. Key is required, including an empty key for a custom no-auth service. 1–20 unique models must match the provider/root.
        All creation and audit changes commit together; directory results do not imply inference compatibility.
        After route synchronization the Worker automatically validates each new model's streaming and tool capabilities.
        Poll the returned models' validation states; automatic validation may consume provider usage.
      responses:
        '202':
          description: Successful owner-scoped result; keys are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAccount'
        default: *id001
      parameters:
      - &id002
        $ref: '#/components/parameters/Origin'
      - &id003
        $ref: '#/components/parameters/Csrf'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ProviderAccountInput'
              - required:
                - api_key
  /v1/my-provider-accounts/{id}:
    put:
      operationId: updateProviderAccount
      x-api-id: API-074
      tags:
      - PersonalModels
      summary: 原子修改提供商名称、密钥与模型集合
      description: Requires personal-model:write and current expected_version. Provider and API root are immutable; create
        another connection to change them. Omitted key reuses the existing credential; rotation creates new immutable versions
        of all retained models. Name-only edits preserve model versions and validations. Removed models additionally require
        personal-model:revoke and zero nondeleted workspace references. Their personal default reference is cleared with a
        new tombstone version. The whole mutation rolls back on any failure.
        Newly added or rotated model versions are automatically validated after synchronization; name-only edits do not
        repeat validation. A failed check can be retried with the existing personal model validate operation.
      responses:
        '202':
          description: Successful owner-scoped result; keys are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAccount'
        default: *id001
      parameters:
      - &id004
        name: id
        in: path
        required: true
        schema: &id006
          type: string
          format: uuid
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderAccountInput'
  /v1/my-provider-accounts/{id}:delete:
    post:
      operationId: deleteProviderAccount
      x-api-id: API-075
      tags:
      - PersonalModels
      summary: 撤销并删除整组模型提供商账号
      description: Requires personal-model:revoke, current expected_version, Origin and CSRF. Blocks if any selected model
        is used by a nondeleted workspace. Atomically clears personal default references and revokes all models. Returns DELETING;
        the durable worker only archives retired models and marks DELETED after every version is confirmed REVOKED. A deleted
        create receipt cannot resurrect the provider.
      responses:
        '202':
          description: Successful owner-scoped result; keys are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAccount'
        default: *id001
      parameters:
      - *id004
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_version
              properties:
                expected_version: &id005
                  type: integer
                  format: int64
                  minimum: 1
  /v1/my-provider-accounts/{id}:sync:
    post:
      operationId: syncProviderAccount
      x-api-id: API-076
      tags:
      - PersonalModels
      summary: 使用本人已保存密钥同步官方模型列表
      description: Requires personal-model:write, current expected_version, exact Origin and CSRF. Rate limit shares the existing
        10 reads/minute per owner. Omitted api_key decrypts one active credential from this exact owner/provider after session
