components:
  securitySchemes:
    OIDCClientBasic:
      type: http
      scheme: basic
      description: The configured confidential platform OIDC client.
    OIDCAccessBearer:
      type: http
      scheme: bearer
      description: Opaque five-minute access token from the embedded provider; business /v1 APIs still use Portal cookies.
    OIDCLoginChallenge:
      type: apiKey
      in: cookie
      name: __Host-hc_identity
      description: Browser-bound login challenge; form CSRF and exact Origin are also required.
    portalSession:
      type: apiKey
      in: cookie
      name: __Host-hc_session
      description: Opaque BFF session; all /v1 writes require CSRF and exact Portal Origin. No browser management bearer tokens.
    gatewayChallenge:
      type: apiKey
      in: cookie
      name: __Host-hc_challenge
      description: Host-only browser challenge secret, paired with challenge_id and a single-use handoff ticket.
  parameters:
    ContextKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [memory, knowledge] }
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Scope org/actor/action/target. Canonical explicit request hash; defaults resolved once. Keep at least 7
        days after terminal state, never expire active operations.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    ConfirmName:
      name: X-Confirm-Instance-Name
      in: header
      required: true
      description: UTF-8 percent-encoded immutable display name (encodeURIComponent). Decoded once and matched exactly; ASCII names remain compatible. No permanent-volume deletion.
      schema:
        type: string
        pattern: ^(?:[A-Za-z0-9_-]|%[0-9A-Fa-f]{2}){1,384}$
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact configured Portal HTTPS origin for platform writes/handoff; challenge endpoint also requires it.
      schema:
        type: string
        format: uri
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Page:
      name: page
      in: query
      description: One-based page number for direct navigation. Cannot be combined with cursor. Omit both for the first page.
      schema:
        type: integer
        minimum: 1
        maximum: 1000000000
    Cursor:
      name: cursor
      in: query
      description: Opaque signed cursor, bound to subject/org/filters, expires in 15 minutes.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
  responses:
    AcceptedOperation:
      description: Command durably accepted; query operation_id for actual completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedOperation'
      headers:
        X-Request-ID:
          schema:
            type: string
    Error:
      description: Error envelope with status mapping in docs/api.md; never raw upstream bodies or secrets. 401/403/404/409/413/415/422/429/500/502/503/504.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            type: string
        Retry-After:
          description: Integer seconds for 429 or a transient 503, when known.
          schema:
            type: integer
            format: int64
            minimum: 0
  schemas:
    MCPTool:
      type: object
      required:
      - name
      - description
      - input_schema
      - definition
      - hash
      - enabled
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 256
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
        definition:
          type: object
          additionalProperties: true
        hash:
          type: string
        enabled:
          type: boolean
        change:
          type: string
          enum:
          - added
          - changed
    MCPConnector:
      type: object
      required:
      - id
      - name
      - description
      - endpoint_id
      - url
      - protocol_version
      - auth_type
      - version
      - catalog_version
      - enabled
      - status
      - server_info
      - tools
      - verified_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        endpoint_id:
