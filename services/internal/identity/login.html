<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · DSH Cloud</title>
  <link rel="stylesheet" href="/oidc/login.css">
  <script src="/oidc/login.js" defer></script>
</head>
<body>
  <main>
    <aside class="product-panel" aria-label="DSH Cloud 平台介绍">
      <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.6A4.5 4.5 0 0 0 18 8h-1.3A7 7 0 1 0 4 16.3"/><path d="M8 16h8"/></svg></span>DSH Cloud</div>
      <div class="product-story">
        <span class="product-eyebrow">你的 AI 工作台</span>
        <h2>让想法在工作空间里落地。</h2>
        <p class="product-description">连接模型、管理技能，在自己的工作环境中专注探索。</p>
        <ul class="product-features">
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8m-4-4v4M7 9l3 3-3 3m6 0h4"/></svg><div><strong>独立工作空间</strong><p>按需配置资源，随时继续工作。</p></div></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg><div><strong>模型与技能</strong><p>连接模型提供商，积累自己的技能库。</p></div></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14a8 3 0 0 0 16 0V5M4 12a8 3 0 0 0 16 0"/></svg><div><strong>工作数据管理</strong><p>浏览、预览和下载你的工作文件。</p></div></li>
        </ul>
      </div>
      <p class="footer">工作空间、数据与技能，一处管理。</p>
    </aside>
    <section class="login-card" aria-labelledby="login-title">
      <header><h1 id="login-title">登录账户</h1><p class="intro">登录后，继续你的工作。</p></header>
      {{if .Error}}<p id="login-error" class="error" role="alert">{{.Error}}</p>{{end}}
      <form method="post" action="/oidc/login">
        <input type="hidden" name="request" value="{{.Request}}">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <div class="field">
          <label for="login">邮箱</label>
          <input id="login" name="login" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required maxlength="254" placeholder="输入登录邮箱" value="{{.Email}}" {{if not .Error}}autofocus{{end}}>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72" placeholder="输入密码" aria-describedby="caps-lock{{if .Error}} login-error{{end}}" {{if .Error}}autofocus{{end}}>
            <button class="password-toggle" type="button" aria-controls="password" aria-label="显示密码" aria-pressed="false" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18" hidden/></svg>
            </button>
          </div>
          <p id="caps-lock" class="field-hint" role="status" hidden>大写锁定已开启</p>
        </div>
        <button class="submit" type="submit"><span class="spinner" aria-hidden="true" hidden></span><span class="submit-label">登录</span><svg class="submit-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        <p class="submit-status" role="status" aria-live="polite"></p>
      </form>
      <p class="support">无法登录？请联系管理员。</p>
      <a class="restart" href="/auth/login">重新开始登录</a>
    </section>
  </main>
</body>
</html>
