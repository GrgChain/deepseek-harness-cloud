name: hc-context

x-direct-network: &direct-network
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: "*"
  no_proxy: "*"

# Only external knowledge/memory services belong in this project. Portal and
# existing DSH containers are managed by their existing deployment.
services:
  bridge:
    image: hc-context-bridge:dev
    build: ./bridge
    profiles: [knowledge, memory, bridge, graphiti, openviking]
    environment:
      <<: *direct-network
      HC_CONTEXT_TEST_KEY: ${HC_CONTEXT_TEST_KEY:?run prepare.py first}
      HC_CONTEXT_PROXY_KEY: ${HC_CONTEXT_PROXY_KEY:?run prepare.py first}
      QDRANT_URL: http://qdrant:6333
      WEAVIATE_URL: http://weaviate:8080
      MILVUS_URL: http://milvus:19530
      HC_CONTEXT_MODEL_CONFIG: ${HC_CONTEXT_MODEL_CONFIG:-e30=}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: "2"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${HC_CONTEXT_TEST_KEY:?run prepare.py first}
      OPENVIKING_URL: http://openviking:1933
      HF_HUB_OFFLINE: "1"
    ports: ["127.0.0.1:18580:8580"]
    volumes: ["bridge-data:/data", "embedding-models:/models"]
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8580/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  embeddings:
    image: hc-context-bridge:dev
    profiles: [openviking]
    command: [uvicorn, embeddings:app, --host, 0.0.0.0, --port, "8581", --no-access-log]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8581/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      <<: *direct-network
      HC_CONTEXT_TEST_KEY: ${HC_CONTEXT_TEST_KEY:?run prepare.py first}
      HF_HUB_OFFLINE: "1"
    volumes: ["embedding-models:/models"]
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped

  openviking:
    image: ghcr.io/volcengine/openviking@sha256:46f9e34cd37238c28cbd9535033773d179006bdf7f3e528dd1c46567abce7701
    profiles: [openviking]
    entrypoint: [openviking-server]
    command: [--config, /run/context/ov.conf, --host, 0.0.0.0, --port, "1933"]
    environment:
      <<: *direct-network
    volumes: ["openviking-data:/data", "../../.local/context/ov.conf:/run/context/ov.conf:ro"]
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.0
    profiles: [graphiti]
    environment:
      <<: *direct-network
      NEO4J_AUTH: neo4j/${HC_CONTEXT_TEST_KEY:?run prepare.py first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: ["neo4j-data:/data"]
    mem_limit: 1536m
    cpus: 2
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:7474]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: [knowledge, memory, qdrant]
    environment:
      <<: *direct-network
      QDRANT__SERVICE__API_KEY: ${HC_CONTEXT_TEST_KEY:?run prepare.py first}
    ports: ["127.0.0.1:16333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    mem_limit: 768m
    cpus: 1
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    profiles: [knowledge, weaviate]
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      <<: *direct-network
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${HC_CONTEXT_TEST_KEY:?run prepare.py first}
      AUTHENTICATION_APIKEY_USERS: context-test
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: context-test
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: context-test
      DISABLE_TELEMETRY: "true"
      LIMIT_RESOURCES: "true"
      DISK_USE_WARNING_PERCENTAGE: "90"
      DISK_USE_READONLY_PERCENTAGE: "97"
    ports: ["127.0.0.1:18085:8080", "127.0.0.1:15051:50051"]
    volumes: ["weaviate-data:/var/lib/weaviate"]
    mem_limit: 768m
    cpus: 1
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: [knowledge, milvus]
    environment:
      <<: *direct-network
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "1073741824"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: [etcd, "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes: ["etcd-data:/etcd"]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: [knowledge, milvus]
    environment:
      <<: *direct-network
      MINIO_ROOT_USER: context-test
      MINIO_ROOT_PASSWORD: ${HC_CONTEXT_TEST_KEY:?run prepare.py first}
    command: [minio, server, /data]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    profiles: [knowledge, milvus]
    command: [milvus, run, standalone]
    environment:
      <<: *direct-network
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: context-test
      MINIO_SECRET_ACCESS_KEY: ${HC_CONTEXT_TEST_KEY:?run prepare.py first}
      MINIO_REGION: us-east-1
      COMMON_STORAGETYPE: remote
      OMP_NUM_THREADS: "2"
    ports: ["127.0.0.1:19531:19530", "127.0.0.1:19091:9091"]
    volumes: ["milvus-data:/var/lib/milvus"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 18
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

volumes:
  neo4j-data:
  openviking-data:
  bridge-data:
  embedding-models:
  qdrant-data:
  weaviate-data:
  etcd-data:
  minio-data:
  milvus-data:
