name: hc-local

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: hc_migrator
      POSTGRES_DB: hc_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../.local/postgres-password:/run/secrets/postgres-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hc_migrator -d hc_dev"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "/run/secrets/redis.conf"]
    user: "${HC_LOCAL_UID:-1000}:${HC_LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - ../../.local/redis.conf:/run/secrets/redis.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
